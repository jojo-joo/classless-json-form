<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classless JSON Form</title>
  <link rel="stylesheet" href="pico.css">
</head>

<body>
  <!-- empty shell: header, menu, forms and styles are all generated by cjf.js -->
  <main></main>

  <!-- demo schema, JSON Schema 2020-12 + x-* UI hints (see mapping.md) -->
  <script type="application/json" id="schema">  {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "$id": "https://example.org/cjf/demo.schema.json",
    "title": "Classless JSON Form",
    "type": "array",
    "prefixItems": [
      {
        "type": "object",
        "title": "Form A",
        "x-format": "accordion",
        "properties": {
          "String": {
            "type": "object",
            "required": [
              "text"
            ],
            "properties": {
              "text": {
                "type": "string",
                "description": "First and Last name",
                "minLength": 4,
                "default": "Jeremy Dorn",
                "title": "Text"
              },
              "date": {
                "type": "string",
                "format": "date",
                "x-format": "date",
                "default": "2026-11-02",
                "title": "Date"
              },
              "time": {
                "type": "string",
                "format": "time",
                "x-format": "time",
                "default": "10:30",
                "title": "Time"
              },
              "datetime": {
                "type": "string",
                "format": "date-time",
                "x-format": "datetime-local",
                "default": "2026-11-02T10:30",
                "title": "Datetime"
              },
              "email": {
                "type": "string",
                "format": "email",
                "x-format": "email",
                "default": "jeremy@example.org",
                "title": "Email"
              },
              "uri": {
                "type": "string",
                "format": "uri",
                "x-format": "uri",
                "default": "https://example.org",
                "title": "Uri"
              },
              "color": {
                "type": "string",
                "x-format": "color",
                "default": "#0eaaaa",
                "title": "Color"
              },
              "file": {
                "type": "string",
                "x-format": "file",
                "title": "File"
              },
              "select": {
                "type": "string",
                "x-format": "select",
                "enum": [
                  "one",
                  "two",
                  "three"
                ],
                "x-enum": [
                  "Option 1",
                  "Option 2",
                  "Option 3"
                ],
                "default": "one",
                "title": "Select"
              },
              "radios": {
                "type": "string",
                "x-format": "radios",
                "enum": [
                  "male",
                  "female",
                  "other"
                ],
                "x-enum": [
                  "Male",
                  "Female",
                  "Other"
                ],
                "default": "female",
                "title": "Radios"
              },
              "radios-inline": {
                "type": "string",
                "x-format": "radios",
                "x-inline": true,
                "enum": [
                  "s",
                  "m",
                  "l"
                ],
                "x-enum": [
                  "Small",
                  "Medium",
                  "Large"
                ],
                "default": "m",
                "title": "Radios inline"
              },
              "disabled": {
                "type": "string",
                "x-disabled": true,
                "placeholder": "Disabled",
                "title": "Disabled"
              },
              "readonly": {
                "type": "string",
                "readOnly": true,
                "default": "Readonly",
                "title": "Readonly"
              },
              "verify": {
                "type": "string",
                "x-format": "buttons",
                "x-inline": true,
                "x-api-addr": "/api/echo",
                "default": "ABC-123",
                "title": "Verify",
                "enum": [
                  "ABC-123"
                ],
                "x-enum": [
                  "Verify"
                ]
              }
            },
            "title": "String"
          },
          "Boolean": {
            "type": "object",
            "properties": {
              "switch": {
                "type": "boolean",
                "x-format": "switch",
                "default": true,
                "title": "Switch"
              },
              "checkbox": {
                "type": "boolean",
                "title": "Checkbox"
              },
              "flag": {
                "type": "boolean",
                "x-format": "select",
                "x-enum": [
                  "Off",
                  "On"
                ],
                "default": false,
                "title": "Flag"
              }
            },
            "title": "Boolean"
          },
          "Number": {
            "type": "object",
            "properties": {
              "quantity": {
                "type": "number",
                "default": 3,
                "title": "Quantity"
              },
              "age": {
                "type": "number",
                "minimum": 18,
                "maximum": 99,
                "default": 25,
                "title": "Age"
              },
              "rating": {
                "type": "number",
                "x-format": "range",
                "minimum": 0,
                "maximum": 5,
                "default": 3,
                "title": "Rating"
              },
              "priority": {
                "type": "number",
                "x-format": "select",
                "enum": [
                  1,
                  2,
                  3
                ],
                "x-enum": [
                  "Low",
                  "Medium",
                  "High"
                ],
                "default": 2,
                "title": "Priority"
              },
              "check": {
                "type": "number",
                "x-format": "buttons",
                "x-api-addr": "/api/check",
                "default": 42,
                "title": "Check",
                "enum": [
                  42
                ],
                "x-enum": [
                  "Check"
                ]
              },
              "radios": {
                "type": "number",
                "x-format": "radios",
                "enum": [
                  1,
                  2,
                  3
                ],
                "x-enum": [
                  "One",
                  "Two",
                  "Three"
                ],
                "default": 2,
                "title": "Radios"
              },
              "radios-inline": {
                "type": "number",
                "x-format": "radios",
                "x-inline": true,
                "enum": [
                  0,
                  1,
                  2
                ],
                "x-enum": [
                  "Zero",
                  "One",
                  "Two"
                ],
                "default": 1,
                "title": "Radios inline"
              },
              "scan": {
                "type": "number",
                "x-format": "buttons",
                "x-inline": true,
                "x-api-addr": "/api/scan",
                "minimum": 0,
                "default": 0,
                "title": "Scan",
                "enum": [
                  0
                ],
                "x-enum": [
                  "Scan"
                ]
              }
            },
            "title": "Number"
          },
          "Array": {
            "type": "object",
            "properties": {
              "tags": {
                "type": "array",
                "items": {
                  "type": "string",
                  "enum": [
                    "art",
                    "code",
                    "music"
                  ]
                },
                "x-enum": [
                  "Art",
                  "Code",
                  "Music"
                ],
                "default": [
                  "code"
                ],
                "title": "Tags"
              },
              "tags-inline": {
                "type": "array",
                "x-inline": true,
                "items": {
                  "type": "string",
                  "enum": [
                    "a",
                    "b",
                    "c"
                  ]
                },
                "x-enum": [
                  "A",
                  "B",
                  "C"
                ],
                "default": [
                  "a"
                ],
                "title": "Tags inline"
              },
              "levels": {
                "type": "array",
                "uniqueItems": true,
                "items": {
                  "type": "integer",
                  "enum": [
                    1,
                    2,
                    3
                  ]
                },
                "x-enum": [
                  "One",
                  "Two",
                  "Three"
                ],
                "default": [
                  2
                ],
                "title": "Levels"
              },
              "pets": {
                "type": "array",
                "x-format": "table",
                "uniqueItems": true,
                "items": {
                  "type": "object",
                  "properties": {
                    "type": {
                      "type": "string",
                      "enum": [
                        "cat",
                        "dog",
                        "bird",
                        "reptile",
                        "other"
                      ],
                      "default": "dog"
                    },
                    "name": {
                      "type": "string"
                    }
                  }
                },
                "default": [
                  {
                    "type": "dog",
                    "name": "Walter"
                  }
                ],
                "title": "Pets"
              }
            },
            "title": "Array"
          },
          "Object": {
            "type": "object",
            "properties": {
              "note": {
                "type": "string",
                "default": "Properties of an object rendered as details + summary",
                "title": "Note"
              }
            },
            "title": "Object"
          }
        },
        "x-buttons": [
          {
            "type": "reset",
            "label": "Default"
          },
          {
            "type": "submit",
            "label": "Submit"
          }
        ]
      },
      {
        "type": "object",
        "title": "Form B",
        "x-format": "accordion",
        "properties": {
          "Condition": {
            "type": "object",
            "properties": {
              "SSID": {
                "type": "string",
                "title": "SSID"
              },
              "password": {
                "type": "string",
                "title": "Password"
              },
              "DHCP": {
                "type": "boolean",
                "x-format": "switch",
                "default": true,
                "title": "DHCP"
              }
            },
            "if": {
              "properties": {
                "DHCP": {
                  "const": true
                }
              },
              "required": [
                "DHCP"
              ]
            },
            "then": {
              "properties": {}
            },
            "else": {
              "properties": {
                "IP": {
                  "type": "string",
                  "title": "IP"
                },
                "NetMask": {
                  "type": "string",
                  "title": "NetMask"
                },
                "DNS": {
                  "type": "string",
                  "title": "DNS"
                }
              }
            },
            "title": "Condition"
          },
          "computed": {
            "type": "object",
            "properties": {
              "first": {
                "type": "string",
                "default": "San",
                "title": "First"
              },
              "last": {
                "type": "string",
                "default": "Francisco",
                "title": "Last"
              },
              "full": {
                "type": "string",
                "readOnly": true,
                "x-template": "{{first}}, {{last}}",
                "x-watch": {
                  "first": "computed.first",
                  "last": "computed.last"
                },
                "title": "Full"
              }
            },
            "title": "Computed"
          }
        },
        "x-buttons": [
          {
            "type": "reset",
            "label": "Default"
          },
          {
            "type": "submit",
            "label": "Submit"
          }
        ]
      }
    ]
  }</script>

  <script src="cjf.js"></script>
  <script>
    CJF.render(document.querySelector('main'),
      JSON.parse(document.getElementById('schema').textContent), {
      // demo only: no backend here, so echo what would be POSTed
      request: function (url, body, done) {
        window.setTimeout(done, 200);
      }
    });
  </script>
</body>

</html>
